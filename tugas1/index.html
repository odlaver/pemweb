<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas 1 - Revaldo</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="sibadut.jpeg" type="image/x-jpg" />
  </head>
  <body>
    <div class="linktree-container">
      <header class="profil-header">
        <img
          src="sibadut.jpeg"
          alt="Top Global Ngebadut"
          class="profil-avatar"
        />
        <h1 class="profil-nama">Revaldo Aja</h1>
        <p class="profil-deskripsi">
          Jika | If | Adalah | Is | Maka | Then | Atau | Or
        </p>
      </header>

      <main class="konten-utama-linktree">
        <section class="daftar-link">
          <a
            href="https://github.com/odlaver"
            target="_blank"
            rel="noopener noreferrer"
            class="tombol-link"
          >
            GitHub
          </a>
          <a
            href="https://www.youtube.com/@odlavr"
            target="_blank"
            rel="noopener noreferrer"
            class="tombol-link"
          >
            YouTube
          </a>
          <a
            href="https://instagram.com/odlavr"
            target="_blank"
            rel="noopener noreferrer"
            class="tombol-link"
          >
            Instagram
          </a>
          <a
            href=""
            rel="noopener noreferrer"
            class="tombol-link tombol-link-penting"
          >
            Klik Aku
          </a>
        </section>

        <section class="video-unggulan">
          <h2><span role="img" aria-label="Ikon">🎬</span> Showcase Dulu Bos 🎬</h2>
          <div class="video-wrapper">
            <iframe
              src="https://www.youtube.com/embed/N7niCn3VYrE"
              title="YouTube Repaldo"
              frameborder="0"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
              "
              allowfullscreen
            >
            </iframe>
          </div>
          <p class="deskripsi-video">NKRI Harga Mati</p>
        </section>
      </main>

      <footer class="linktree-footer">
        <p>"kapan yah" adalah caraku mengekspresikan bahwa aku juga mau.</p>
      </footer>
    </div>
  </body>
</html>
